[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "J.A.R.V.I.S. - Just A Rather Very Intelligent System (Personal Assistant)"
authors = [
    {name = "Daniel Rocha", email = "daniel@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "typing-extensions>=4.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0"
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.9.0"
]
[project.scripts]
jarvis = "main:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {}}
py-modules = ["main"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]